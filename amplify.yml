# AWS Amplify Hosting build spec for the Superadmin panel.
#
# This is a pnpm workspace monorepo, so the `applications` form is required:
# the working directory starts at `appRoot`, and the install has to happen at
# the repo root for the workspace links to resolve.
#
# Every `cd` is wrapped in a subshell. Amplify runs all phases in ONE shell, so
# a bare `cd ../..` in preBuild leaks into build and the next `cd ../..`
# overshoots the repo entirely (ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND). Subshells
# keep each command anchored at `appRoot` no matter what ran before it.
version: 1
applications:
  - appRoot: apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            # Next 16 needs Node >= 20, and CI builds on 20 - keep them matched
            # so a green CI build cannot mean a red Amplify build.
            - nvm use 20 || nvm install 20
            # pnpm 8: pnpm-lock.yaml is lockfileVersion 6.0 and pnpm 9+ rejects
            # it under --frozen-lockfile.
            - corepack enable
            - corepack prepare pnpm@8.15.6 --activate
            - (cd ../.. && pnpm install --frozen-lockfile)
        build:
          commands:
            # Amplify does NOT pass environment variables to the Next SSR
            # runtime. That is deliberate on AWS's part - "a Next.js server
            # component doesn't have access to those environment variables by
            # default ... intentional to protect any secrets stored in
            # environment variables" - so a server var set in the console is
            # present during the build and absent when a request arrives.
            #
            # The documented remedy is to write them into .env.production
            # before `next build`. cwd is appRoot, so this lands in
            # apps/admin/.env.production, which is what the monorepo form
            # requires.
            #
            # ALLOWLIST, never a blanket `env`. The build environment also holds
            # AWS credentials and Amplify internals, and this file ships inside
            # the deployment artifact.
            #
            # NOTE: the command below must NOT begin with a comment line.
            # Amplify silently SKIPS any build command whose first line starts
            # with '#' - no warning, no log entry, the step simply never runs.
            # That cost a full deploy cycle. Keep prose in YAML comments here,
            # outside the block scalar.
            #
            # Exact-anchored allowlist. `env | grep` is the form AWS's own docs
            # use and is POSIX, unlike ${!VAR} indirect expansion - the build
            # shell is not guaranteed to be bash.
            #
            # The build sha is RENAMED on the way in rather than allowlisted.
            # `AWS_COMMIT_ID` cannot be added to the pattern below: the leak
            # guard fails the build on any `^AWS_` line in the artifact, so
            # allowlisting it writes the variable and then aborts.
            # Written only when it LOOKS LIKE A COMMIT, not merely when it is
            # non-empty. `NEXT_PUBLIC_*` is inlined at build time, so an empty
            # value would be inlined as `''` and read as a present-but-blank sha
            # rather than an absent one - but a non-empty non-sha is worse,
            # because it reads as a correctly populated field. A manually started
            # job (`amplify start-job`) supplies AWS_COMMIT_ID as the literal
            # string `HEAD`, which a presence test accepts and publishes; a
            # webhook build supplies a real sha. So the presence test was right
            # every ordinary day and wrong during a hand-run recovery deploy,
            # which is exactly when "which commit is live" is the question being
            # asked. Anything that is not a hex sha yields an absent buildSha,
            # which is honest, instead of one that identifies nothing.
            #
            # `case` rather than `grep -qE '^...$'`, because grep anchors PER
            # LINE and `printf '%s'` preserves embedded newlines: a value of
            # "HEAD\ndeadbeef1234" has a matching line and `grep -q` succeeds,
            # so a validity check written to reject an invalid value accepted
            # one. Nothing today can reach it - AWS_COMMIT_ID is platform-set
            # and `git rev-parse HEAD` emits one line - but it is the same class
            # this change exists to close, one layer out. `case` is whole-string
            # by construction and needs no external command.
            # Both cases are accepted deliberately. Git emits lowercase, so
            # uppercase has no known source - but narrowing the predicate to
            # lowercase could only ever turn a WORKING sha into an absent one,
            # and no non-sha this is guarding against is hex in any case.
            #
            # The git fallback is what makes a hand-run deploy report a real
            # commit rather than nothing: Amplify clones the repository, so the
            # checkout is authoritative for what was built even when the platform
            # declines to name it.
            #
            # The success line prints the VALUE and the source, not just that a
            # branch was taken. Job 64 wrote `HEAD` and job 65 wrote a real sha
            # and the old line was byte-identical in both, so it carried no
            # information. The log is not blind - a manual job omits `Switching
            # to commit` entirely, and that absence is readable - but an absence
            # establishes only that no sha was REQUESTED; it never names the
            # commit that arrived. Printing the value answers that directly
            # rather than by inference from an omission and a clone timestamp.
            # A commit sha is not a secret and is already inlined into the
            # artifact.
            # It is written BEFORE the names listing and the leak guard on
            # purpose: the listing is the build log's record of what shipped, and
            # the guard exists to catch a mistake in exactly this kind of write.
            # A write placed after them is in neither.
            - |
              : > .env.production
              env | grep -E '^(DATABASE_URL|SUPERTOKENS_CONNECTION_URI|SUPERTOKENS_API_KEY|NEXT_PUBLIC_APP_ORIGIN|SUPERADMIN_BOOTSTRAP_EMAILS|PLUNK_API_KEY|PLUNK_API_ENDPOINT|AP_SIGNING_KEY|AP_SIGNING_KEY_ID|CONSENT_INTAKE_KEY|CONTACT_INTAKE_KEY|TIKTOK_CLIENT_KEY|TIKTOK_CLIENT_SECRET|TIKTOK_REDIRECT_URI|INSTAGRAM_APP_ID|INSTAGRAM_APP_SECRET|INSTAGRAM_REDIRECT_URI|SOCIAL_TOKEN_KEY|SOCIAL_SCHEDULER_KEY)=' >> .env.production || true
              # >>> build sha
              is_commit_sha() {
                case "$1" in
                  ''|*[!0-9a-fA-F]*) return 1 ;;
                esac
                [ "${#1}" -ge 7 ] && [ "${#1}" -le 40 ]
              }
              BUILD_SHA=""
              BUILD_SHA_SOURCE="none"
              if is_commit_sha "$AWS_COMMIT_ID"; then
                BUILD_SHA="$AWS_COMMIT_ID"
                BUILD_SHA_SOURCE="AWS_COMMIT_ID"
              else
                echo "WARN: AWS_COMMIT_ID is not a commit sha (got '$AWS_COMMIT_ID') - trying git"
                GIT_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
                if is_commit_sha "$GIT_SHA"; then
                  BUILD_SHA="$GIT_SHA"
                  BUILD_SHA_SOURCE="git"
                fi
              fi
              if [ -n "$BUILD_SHA" ]; then
                echo "NEXT_PUBLIC_BUILD_SHA=$BUILD_SHA" >> .env.production
                echo "OK: NEXT_PUBLIC_BUILD_SHA=$BUILD_SHA (from $BUILD_SHA_SOURCE)"
              else
                echo "WARN: no commit sha available - /api/health and the Health page will report buildSha as absent"
              fi
              # <<< build sha
              echo "--- .env.production written, NAMES ONLY ---"
              cut -d= -f1 .env.production
              if grep -qE '^AWS_|^AMPLIFY_' .env.production; then
                echo "FAIL: build-environment variables leaked into the artifact"; exit 1
              fi
              for R in DATABASE_URL SUPERTOKENS_CONNECTION_URI SUPERTOKENS_API_KEY; do
                grep -q "^$R=" .env.production || { echo "FAIL: $R missing - the app cannot boot without it"; exit 1; }
              done
              echo "OK: required runtime vars present"
            # Migrations run on the production branch only. Amplify builds every
            # branch, and a preview build must never migrate the live database.
            # This is what stops a repeat of the 2026-08-11 outage, where code
            # shipped ahead of the schema because nothing ran migrate deploy.
            - |
              if [ "$AWS_BRANCH" = "main" ]; then
                (cd ../.. && pnpm run migrate:deploy)
              else
                echo "Skipping migrate:deploy on branch '$AWS_BRANCH' (production is 'main')"
              fi
            - (cd ../.. && pnpm run build --filter admin)
            # Copy the Prisma query engine into the deployed artifact.
            #
            # .next IS the artifact (see baseDirectory below), so anything put
            # here ships. The engine cannot get there on its own: Prisma writes
            # it beside the generated client in packages/, outputFileTracingIncludes
            # only records it in a manifest, and Amplify does not follow trace
            # entries that escape the app directory. packages/database/src/client.ts
            # resolves it back out of .next/prisma at runtime.
            - |
              ENGINE=libquery_engine-rhel-openssl-3.0.x.so.node
              SRC=../../packages/database/src/generated/client/$ENGINE
              mkdir -p .next/prisma
              if [ ! -f "$SRC" ]; then
                echo "FAIL: $ENGINE was not generated at $SRC"
                echo "      (is binaryTargets still set in schema.prisma?)"
                ls -la ../../packages/database/src/generated/client/ || true
                exit 1
              fi
              cp "$SRC" .next/prisma/
              echo "copied $ENGINE -> .next/prisma/ ($(du -h .next/prisma/$ENGINE | cut -f1))"
              # Assert rather than trust. Every layer of this failure is silent:
              # the build goes green, the deploy succeeds, and only a query in
              # production reveals PrismaClientInitializationError.
              if [ -f ".next/prisma/$ENGINE" ]; then
                echo "OK: engine is in the artifact"
              else
                echo "FAIL: engine missing from .next/prisma after copy"
                exit 1
              fi
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
