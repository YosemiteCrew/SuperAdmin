# AWS Amplify Hosting build spec for the Superadmin panel.
#
# This is a pnpm workspace monorepo, so the `applications` form is required:
# the working directory starts at `appRoot`, and the install has to happen at
# the repo root for the workspace links to resolve.
#
# Every `cd` is wrapped in a subshell. Amplify runs all phases in ONE shell, so
# a bare `cd ../..` in preBuild leaks into build and the next `cd ../..`
# overshoots the repo entirely (ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND). Subshells
# keep each command anchored at `appRoot` no matter what ran before it.
version: 1
applications:
  - appRoot: apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            # Next 16 needs Node >= 20, and CI builds on 20 - keep them matched
            # so a green CI build cannot mean a red Amplify build.
            - nvm use 20 || nvm install 20
            # pnpm 8: pnpm-lock.yaml is lockfileVersion 6.0 and pnpm 9+ rejects
            # it under --frozen-lockfile.
            - corepack enable
            - corepack prepare pnpm@8.15.6 --activate
            - (cd ../.. && pnpm install --frozen-lockfile)
        build:
          commands:
            # Migrations run on the production branch only. Amplify builds every
            # branch, and a preview build must never migrate the live database.
            # This is what stops a repeat of the 2026-08-11 outage, where code
            # shipped ahead of the schema because nothing ran migrate deploy.
            - |
              if [ "$AWS_BRANCH" = "main" ]; then
                (cd ../.. && pnpm run migrate:deploy)
              else
                echo "Skipping migrate:deploy on branch '$AWS_BRANCH' (production is 'main')"
              fi
            - (cd ../.. && pnpm run build --filter admin)
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
