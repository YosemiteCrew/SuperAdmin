# AWS Amplify Hosting build spec for the Superadmin panel.
#
# This is a pnpm workspace monorepo, so the `applications` form is required:
# the working directory starts at `appRoot`, and the install has to happen at
# the repo root for the workspace links to resolve.
#
# Every `cd` is wrapped in a subshell. Amplify runs all phases in ONE shell, so
# a bare `cd ../..` in preBuild leaks into build and the next `cd ../..`
# overshoots the repo entirely (ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND). Subshells
# keep each command anchored at `appRoot` no matter what ran before it.
version: 1
applications:
  - appRoot: apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            # Next 16 needs Node >= 20, and CI builds on 20 - keep them matched
            # so a green CI build cannot mean a red Amplify build.
            - nvm use 20 || nvm install 20
            # pnpm 8: pnpm-lock.yaml is lockfileVersion 6.0 and pnpm 9+ rejects
            # it under --frozen-lockfile.
            - corepack enable
            - corepack prepare pnpm@8.15.6 --activate
            - (cd ../.. && pnpm install --frozen-lockfile)
        build:
          commands:
            # Migrations run on the production branch only. Amplify builds every
            # branch, and a preview build must never migrate the live database.
            # This is what stops a repeat of the 2026-08-11 outage, where code
            # shipped ahead of the schema because nothing ran migrate deploy.
            - |
              if [ "$AWS_BRANCH" = "main" ]; then
                (cd ../.. && pnpm run migrate:deploy)
              else
                echo "Skipping migrate:deploy on branch '$AWS_BRANCH' (production is 'main')"
              fi
            - (cd ../.. && pnpm run build --filter admin)
            # Copy the Prisma query engine into the deployed artifact.
            #
            # .next IS the artifact (see baseDirectory below), so anything put
            # here ships. The engine cannot get there on its own: Prisma writes
            # it beside the generated client in packages/, outputFileTracingIncludes
            # only records it in a manifest, and Amplify does not follow trace
            # entries that escape the app directory. packages/database/src/client.ts
            # resolves it back out of .next/prisma at runtime.
            - |
              ENGINE=libquery_engine-rhel-openssl-3.0.x.so.node
              SRC=../../packages/database/src/generated/client/$ENGINE
              mkdir -p .next/prisma
              if [ ! -f "$SRC" ]; then
                echo "FAIL: $ENGINE was not generated at $SRC"
                echo "      (is binaryTargets still set in schema.prisma?)"
                ls -la ../../packages/database/src/generated/client/ || true
                exit 1
              fi
              cp "$SRC" .next/prisma/
              echo "copied $ENGINE -> .next/prisma/ ($(du -h .next/prisma/$ENGINE | cut -f1))"
              # Assert rather than trust. Every layer of this failure is silent:
              # the build goes green, the deploy succeeds, and only a query in
              # production reveals PrismaClientInitializationError.
              if [ -f ".next/prisma/$ENGINE" ]; then
                echo "OK: engine is in the artifact"
              else
                echo "FAIL: engine missing from .next/prisma after copy"
                exit 1
              fi
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
