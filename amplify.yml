# Build spec for the Superadmin panel.
#
# This is a pnpm workspace monorepo, so the `applications` form is used: each
# command starts in `appRoot`, and the install runs at the repo root so the
# workspace links resolve. Every `cd` is wrapped in a subshell so each command
# stays anchored at `appRoot`.
version: 1
applications:
  - appRoot: apps/admin
    frontend:
      phases:
        preBuild:
          commands:
            # Keep the Node major matched with CI.
            - nvm use 22 || nvm install 22
            # pnpm 8: pnpm-lock.yaml is lockfileVersion 6.0 and pnpm 9+ rejects
            # it under --frozen-lockfile.
            - corepack enable
            - corepack prepare pnpm@8.15.6 --activate
            - (cd ../.. && pnpm install --frozen-lockfile)
        build:
          commands:
            # Server-side variables are written into .env.production before
            # `next build` so the runtime can read them. Only the names in the
            # allowlist below are written.
            #
            # A build command must not begin with a comment line.
            #
            # NEXT_PUBLIC_BUILD_SHA is written only when the value looks like a
            # commit (7 to 40 hex characters), falling back to
            # `git rev-parse HEAD`; otherwise /api/health reports buildSha as
            # absent. `case` checks the whole value rather than one line of it.
            - |
              : > .env.production
              env | grep -E '^(DATABASE_URL|SUPERTOKENS_CONNECTION_URI|SUPERTOKENS_API_KEY|NEXT_PUBLIC_APP_ORIGIN|PANEL_BASIC_AUTH_CREDENTIALS|SUPERADMIN_BOOTSTRAP_EMAILS|PLUNK_API_KEY|PLUNK_API_ENDPOINT|AP_SIGNING_KEY|AP_SIGNING_KEY_ID|CONSENT_INTAKE_KEY|CONTACT_INTAKE_KEY|TIKTOK_CLIENT_KEY|TIKTOK_CLIENT_SECRET|TIKTOK_REDIRECT_URI|INSTAGRAM_APP_ID|INSTAGRAM_APP_SECRET|INSTAGRAM_REDIRECT_URI|SOCIAL_TOKEN_KEY|SOCIAL_SCHEDULER_KEY)=' >> .env.production || true
              # >>> build sha
              is_commit_sha() {
                case "$1" in
                  ''|*[!0-9a-fA-F]*) return 1 ;;
                esac
                [ "${#1}" -ge 7 ] && [ "${#1}" -le 40 ]
              }
              BUILD_SHA=""
              BUILD_SHA_SOURCE="none"
              if is_commit_sha "$AWS_COMMIT_ID"; then
                BUILD_SHA="$AWS_COMMIT_ID"
                BUILD_SHA_SOURCE="AWS_COMMIT_ID"
              else
                echo "WARN: AWS_COMMIT_ID is not a commit sha (got '$AWS_COMMIT_ID') - trying git"
                GIT_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
                if is_commit_sha "$GIT_SHA"; then
                  BUILD_SHA="$GIT_SHA"
                  BUILD_SHA_SOURCE="git"
                fi
              fi
              if [ -n "$BUILD_SHA" ]; then
                echo "NEXT_PUBLIC_BUILD_SHA=$BUILD_SHA" >> .env.production
                echo "OK: NEXT_PUBLIC_BUILD_SHA=$BUILD_SHA (from $BUILD_SHA_SOURCE)"
              else
                echo "WARN: no commit sha available - /api/health and the Health page will report buildSha as absent"
              fi
              # <<< build sha
              echo "--- .env.production written, NAMES ONLY ---"
              cut -d= -f1 .env.production
              if grep -qE '^AWS_|^AMPLIFY_' .env.production; then
                echo "FAIL: build-environment variables leaked into the artifact"; exit 1
              fi
              for R in DATABASE_URL SUPERTOKENS_CONNECTION_URI SUPERTOKENS_API_KEY PANEL_BASIC_AUTH_CREDENTIALS; do
                grep -q "^$R=" .env.production || { echo "FAIL: $R missing - the app cannot boot without it"; exit 1; }
              done
              echo "OK: required runtime vars present"
            - (cd ../.. && pnpm run build --filter admin)
            # Start the built app and require /api/health to report the database
            # as up before the build is accepted. It runs a read-only query and
            # needs no migration.
            - |
              PORT=3001
              HEALTH_URL="http://127.0.0.1:$PORT/api/health"
              # Resolved rather than pathed, and started without a wrapper.
              # node-linker=hoisted (see .npmrc) means apps/admin/node_modules
              # does not exist, so there is no local .bin to point at; and $!
              # has to belong to the server itself for the `kill -0` liveness
              # check below to mean anything.
              NEXT_BIN=$(node -e "process.stdout.write(require.resolve('next/dist/bin/next'))")
              node "$NEXT_BIN" start --port "$PORT" > /tmp/next-start.log 2>&1 &
              APP_PID=$!
              CODE=000
              for _ in $(seq 1 45); do
                if ! kill -0 "$APP_PID" 2>/dev/null; then
                  echo "FAIL: next start exited before answering $HEALTH_URL"
                  cat /tmp/next-start.log
                  exit 1
                fi
                # Remove the body first and assign 000 on any curl failure, so a
                # refused connection during startup can never be read as a
                # previous iteration's success.
                rm -f /tmp/health.json
                CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' "$HEALTH_URL") || CODE=000
                if [ "$CODE" = "200" ]; then break; fi
                sleep 2
              done
              kill "$APP_PID" 2>/dev/null || true
              wait "$APP_PID" 2>/dev/null || true
              if [ "$CODE" != "200" ]; then
                echo "FAIL: $HEALTH_URL answered $CODE, expected 200"
                cat /tmp/health.json 2>/dev/null || true
                cat /tmp/next-start.log
                exit 1
              fi
              # 200 already means database:up - the route returns 503 when the
              # probe throws - but assert the field rather than inferring it from
              # the status, because a later edit to the route could separate them.
              if ! grep -q '"database":"up"' /tmp/health.json; then
                echo "FAIL: /api/health returned 200 without \"database\":\"up\""
                cat /tmp/health.json
                cat /tmp/next-start.log
                exit 1
              fi
              echo "OK: the built artifact reached Postgres through the pg driver adapter"
            # Migrations run on main only, and only after the check above has
            # accepted the build.
            - |
              if [ "$AWS_BRANCH" = "main" ]; then
                (cd ../.. && pnpm run migrate:deploy)
              else
                echo "Skipping migrate:deploy on branch '$AWS_BRANCH' (production is 'main')"
              fi
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
