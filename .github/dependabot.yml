version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    # No `target-branch`, so Dependabot opens against the default branch, `main`.
    #
    # This deliberately reverses the earlier `target-branch: 'dev'`. That setting
    # assumed `dev` was an integration branch promoted to `main`, and the drift it
    # was written to prevent is real - see #130 for the back-merge that repaired
    # the last one. But `dev` stopped being promoted: it went 30 commits behind
    # `main` while holding one commit `main` did not have, so pointing dependency
    # updates at it recreated exactly the one-way drift the setting existed to
    # stop, in the opposite direction. `main` is what deploys; `dev` deploys
    # nowhere.
    #
    # Omitted rather than set to `'main'` on purpose: this then follows the
    # default branch instead of naming a value that can silently disagree with it.
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # These majors are held back deliberately. Without these rules Dependabot
      # re-proposes them in every dev-dependencies batch, which lands a red PR
      # and costs a manual revert each time (this happened in #116, #121, #127).
      #
      # eslint 10 + eslint-config-next 16: apps/admin loads eslint-config-next
      # through FlatCompat (@eslint/eslintrc). Under eslint 10 that loader dies
      # with "Converting circular structure to JSON" in config-validator, so lint
      # fails repo-wide. The two must move together, and only once the flat-config
      # migration is done. Lift both rules in the same PR.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-next'
        update-types: ['version-update:semver-major']
      # typescript 7 is the Go-based native compiler rewrite; ts-jest@29 and
      # ts-node@10 do not support it, so type-check and the jest transform break.
      # Lift once those two declare TS 7 support.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # prisma 7 + @prisma/client 7 drop `url` from the schema's datasource
      # block: connection URLs move to a prisma.config.ts for Migrate, and the
      # client takes an `adapter` (or accelerateUrl) instead. packages/database
      # still declares `url = env("DATABASE_URL")`, so v7 fails schema validation
      # (P1012) inside `prisma generate` — which runs in that package's
      # postinstall, so `pnpm install` itself dies and EVERY job goes red, not
      # just the database ones. That is what happened in #143 and #144.
      # The two must move together, and only once the migration is done.
      # Lift both rules in the same PR.
      - dependency-name: 'prisma'
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/client'
        update-types: ['version-update:semver-major']
