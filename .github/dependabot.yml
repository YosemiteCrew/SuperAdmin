version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    # No `target-branch`, so Dependabot opens against the default branch, `main`.
    #
    # This deliberately reverses the earlier `target-branch: 'dev'`. That setting
    # assumed `dev` was an integration branch promoted to `main`, and the drift it
    # was written to prevent is real - see #130 for the back-merge that repaired
    # the last one. But `dev` stopped being promoted: it went 30 commits behind
    # `main` while holding one commit `main` did not have, so pointing dependency
    # updates at it recreated exactly the one-way drift the setting existed to
    # stop, in the opposite direction. `main` is what deploys; `dev` deploys
    # nowhere.
    #
    # Omitted rather than set to `'main'` on purpose: this then follows the
    # default branch instead of naming a value that can silently disagree with it.
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # eslint 10 remains outside the peer ranges declared by three plugins
      # bundled with eslint-config-next 16. Keep this hold until that graph is
      # supported; the native flat-config migration no longer couples it to
      # eslint-config-next's major.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # The admin lint stack still rejects TypeScript 7 explicitly through
      # typescript-eslint, which requires typescript <6.1.0. ts-jest and
      # ts-node were removed from apps/admin (jest.config is plain ESM,
      # check-pnpm-overrides is plain ESM), so they no longer bind this hold.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
