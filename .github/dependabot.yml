version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    # No `target-branch`, so Dependabot opens against the default branch, `main`.
    #
    # This deliberately reverses the earlier `target-branch: 'dev'`. That setting
    # assumed `dev` was an integration branch promoted to `main`, and the drift it
    # was written to prevent is real - see #130 for the back-merge that repaired
    # the last one. But `dev` stopped being promoted: it went 30 commits behind
    # `main` while holding one commit `main` did not have, so pointing dependency
    # updates at it recreated exactly the one-way drift the setting existed to
    # stop, in the opposite direction. `main` is what deploys; `dev` deploys
    # nowhere.
    #
    # Omitted rather than set to `'main'` on purpose: this then follows the
    # default branch instead of naming a value that can silently disagree with it.
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # react and react-dom are a peer pair that must move in lockstep: react-dom
      # asserts at runtime that both resolve to the exact same version, and its
      # peerDependency floor rises with every minor. Ungrouped, they are two
      # production dependencies, so Dependabot opened one PR each - and each half
      # regenerated the lockfile for only its own side. Both were red with
      # "Incompatible React versions" and 60 of 181 suites failing to run, which
      # is not a fault in either PR: neither can be green alone, and merging one
      # would have broken `main`. See #496 and #497. The type packages join the
      # group because @types/react-dom's peer floor tracks @types/react the same
      # way. Declared BEFORE dev-dependencies so the two devDependency type
      # packages land here rather than in the weekly dev group.
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      dev-dependencies:
        dependency-type: development
    ignore:
      # eslint 10 remains outside the peer ranges declared by three plugins
      # bundled with eslint-config-next 16. Keep this hold until that graph is
      # supported; the native flat-config migration no longer couples it to
      # eslint-config-next's major.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      # The admin lint stack still rejects TypeScript 7 explicitly through
      # typescript-eslint, which requires typescript <6.1.0. ts-jest and
      # ts-node were removed from apps/admin (jest.config is plain ESM,
      # check-pnpm-overrides is plain ESM), so they no longer bind this hold.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @types/node tracks the Node runtime major, not the latest release.
      # `.nvmrc`, `amplify.yml` and every workflow pin Node 22 (#595), and
      # nodeVersion.test.ts fails when the type surface disagrees - which is
      # what turned #605 red. Release this hold in the commit that moves the
      # runtime, not before.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
