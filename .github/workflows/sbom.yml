name: SBOM

# A software bill of materials for every commit that deploys. main is the
# branch the panel is built from, so each push to main keeps a CycloneDX and an
# SPDX file for that commit as the `sbom-<sha>` artifact. What goes into it and
# why is at the top of scripts/ci/sbom.sh, which does the work.
#
# Pull requests run it only when they change the SBOM itself, so a change to
# the script or this file is proven before it merges.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/sbom.yml
      - scripts/ci/sbom.sh
      - scripts/ci/sbom.test.mjs
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A pull request shares one group, so a superseded run is cancelled. Anything
  # else gets a group of its own commit: in a shared group a newer run still
  # replaces one that is waiting, and every commit on main is a deploy that
  # needs its own SBOM.
  group: sbom-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      # No pnpm cache here: this job fetches only the production packages, and
      # saving that store under the key the other workflows share would leave
      # their restored cache without the development tools.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Test the SBOM script
        run: node --test scripts/ci/sbom.test.mjs

      # Production dependencies only: development tooling does not ship, and
      # the script refuses a node_modules that has it. No install scripts run,
      # because nothing here is built.
      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Generate CycloneDX and SPDX
        run: bash scripts/ci/sbom.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: security/sbom/
          if-no-files-found: error
          retention-days: 90
