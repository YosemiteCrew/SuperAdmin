name: Deployed commit

# Did this merge actually ship?
#
# `/api/health` publishes the commit the running build was made from, so one
# request answers whether a merge to `main` is what the deployed panel serves.
# The route answers without authentication, so this check needs no credential.
#
# It runs after the merge, so it reports on `main` rather than gating pull
# requests.

on:
  push:
    branches: [main]
  # Answers "is main deployed right now?" without a push.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deployed-commit-${{ github.ref }}
  # Never cancel: a cancelled run verifies nothing. Two merges close together
  # are handled below instead.
  cancel-in-progress: false

jobs:
  assert:
    name: main is serving this commit
    runs-on: ubuntu-latest
    if: github.repository_owner == 'YosemiteCrew'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Wait for the deployed commit to match
        shell: bash
        env:
          ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ -z "$ADMIN_ORIGIN" ]; then
            echo "Missing repository secret: ADMIN_ORIGIN"
            exit 1
          fi
          # The poll, its window and the supersession rule live in the script,
          # which admin-e2e.yml shares. Exit 3 is SUPERSEDED: a newer merge
          # replaced this deploy and its own run asserts that one, so it is not
          # a failure of this commit. Every other non-zero exit is.
          status=0
          bash scripts/ci/wait-for-deployed-main.sh "$ADMIN_ORIGIN/api/health" "$EXPECTED_SHA" || status=$?
          if [ "$status" -eq 3 ]; then
            exit 0
          fi
          exit "$status"
