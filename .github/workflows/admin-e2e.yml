name: Admin E2E

on:
  pull_request:
    paths:
      - 'apps/admin/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/admin-e2e.yml'
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: admin-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs on every PR against a locally built app. No secrets: a pull_request runs
  # PR-controlled code, including this workflow file, which is exactly the surface
  # that could exfiltrate them.
  local:
    name: E2E (local build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin exec playwright install --with-deps chromium
      - run: pnpm --filter admin run build
      - name: Run specs against the local build
        env:
          E2E_WEB_SERVER_COMMAND: pnpm --filter admin run start
        run: pnpm --filter admin run e2e -- --project=chromium

  # Runs only on trusted refs, where secrets resolve. This is the leg that can
  # observe the panel real users hit - the deployed origin has been returning 401
  # at the CloudFront edge to every request, including the public /api/health,
  # with the whole suite green, because nothing had ever pointed at it.
  deployed:
    name: E2E (deployed panel)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin exec playwright install --with-deps chromium
      - name: Fail early if the deployed leg is unprovisioned
        env:
          SA_EDGE_GATE_CREDENTIALS: ${{ secrets.SA_EDGE_GATE_CREDENTIALS }}
          SA_E2E_EMAIL: ${{ secrets.SA_E2E_EMAIL }}
          SA_E2E_PASSWORD: ${{ secrets.SA_E2E_PASSWORD }}
        run: |
          missing=""
          [ -n "$SA_EDGE_GATE_CREDENTIALS" ] || missing="$missing SA_EDGE_GATE_CREDENTIALS"
          [ -n "$SA_E2E_EMAIL" ]             || missing="$missing SA_E2E_EMAIL"
          [ -n "$SA_E2E_PASSWORD" ]          || missing="$missing SA_E2E_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "A deployed run without these silently proves nothing, so it fails instead."
            exit 1
          fi
      - name: Run specs against the deployed panel
        env:
          E2E_BASE_URL: https://admin.yosemitecrew.com
          SA_EDGE_GATE_CREDENTIALS: ${{ secrets.SA_EDGE_GATE_CREDENTIALS }}
          SA_E2E_EMAIL: ${{ secrets.SA_E2E_EMAIL }}
          SA_E2E_PASSWORD: ${{ secrets.SA_E2E_PASSWORD }}
        run: pnpm --filter admin run e2e -- --project=chromium

  # Skipped, cancelled and never-started all render as green without this.
  admin-e2e-required:
    name: Admin E2E Required
    if: always()
    needs: [local, deployed]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every leg actually ran and passed
        env:
          LOCAL: ${{ needs.local.result }}
          DEPLOYED: ${{ needs.deployed.result }}
        run: |
          echo "local=$LOCAL deployed=$DEPLOYED"
          case "$LOCAL" in failure|cancelled|skipped)
            echo "Admin E2E Required: the local leg failed, was cancelled, or did not run"; exit 1 ;;
          esac
          # The deployed leg is deliberately absent on pull_request, where secrets
          # are withheld. Anywhere else, absence is a failure.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            case "$DEPLOYED" in failure|cancelled|skipped)
              echo "Admin E2E Required: the deployed leg failed, was cancelled, or did not run"; exit 1 ;;
            esac
          fi
          echo "Admin E2E Required: passed"
