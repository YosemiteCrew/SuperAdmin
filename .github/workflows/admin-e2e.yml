name: Admin E2E

# Triggered on EVERY pull request, with the path decision made inside the jobs.
# A pull_request.paths filter here looks equivalent and is not: once
# `Admin E2E Required` is marked required on the branch ruleset, a PR touching
# none of those paths skips the whole workflow, the required context is never
# created, and the PR waits for it forever. `if: always()` cannot rescue a
# workflow that was never triggered.
on:
  pull_request: {}
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: admin-e2e-${{ github.ref }}
  # Cancel superseded runs on a pull request only, as ci-affected does. On a
  # branch push the deployed leg waits for its own build, and a newer push
  # cancelling that wait would leave the earlier commit unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect admin changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the admin suite needs to run
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Fail open off pull_request: a push to dev or main, or a manual
          # dispatch, is never the case this filter exists to skip.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "admin=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" \
            -- 'apps/admin/**' 'packages/**' 'pnpm-lock.yaml' \
               '.github/workflows/admin-e2e.yml' | wc -l)
          if [ "$CHANGED" -gt 0 ]; then
            echo "admin=true" >> "$GITHUB_OUTPUT"
          else
            echo "admin=false" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every PR against a locally built app. No secrets: a pull_request runs
  # PR-controlled code, including this workflow file, which is exactly the surface
  # that could exfiltrate them.
  local:
    name: E2E (local build)
    needs: [changes]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest

    # `next build` collects /api/auth/[[...path]], which needs a REACHABLE
    # SuperTokens core - placeholder env vars are not enough, and the build fails
    # identically on plain dev without one. Standing the real dependencies up as
    # services is what makes this app buildable in CI at all. Both are ephemeral
    # and seeded here; nothing below is a credential.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: admin_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      supertokens:
        image: supertokens/supertokens-postgresql:12.2
        env:
          POSTGRESQL_CONNECTION_URI: postgresql://ci:ci@postgres:5432/admin_ci
          API_KEYS: ci-core-key-not-a-secret
        ports: ['3567:3567']

    env:
      # ?schema=superadmin is load bearing, not cosmetic: every table and row
      # lives in that schema and `public` holds nothing, so without it
      # `migrate deploy` re-applies cleanly into an empty public, reports
      # success, and the panel comes up looking freshly installed. The repo
      # refuses to migrate without it, which is why this job stopped here.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/admin_ci?schema=superadmin
      SUPERTOKENS_CONNECTION_URI: http://localhost:3567
      SUPERTOKENS_API_KEY: ci-core-key-not-a-secret
      NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
      # Required by `next build`. Same placeholder as ci-affected.
      SUPERADMIN_BOOTSTRAP_EMAILS: admin@example.com
      # Production builds require the panel's Basic Auth setting, and the local
      # Playwright client presents the same placeholder credential.
      PANEL_BASIC_AUTH_CREDENTIALS: ci-gate:ci-gate-placeholder
      SA_EDGE_GATE_CREDENTIALS: ci-gate:ci-gate-placeholder

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Wait for the SuperTokens core
        run: |
          set -euo pipefail
          # The core has no health probe of its own, and a build that starts one
          # second early fails with the same "Failed to collect page data" as a
          # genuinely broken change. Bounded: never poll forever.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3567/hello >/dev/null; then
              echo "core up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "SuperTokens core did not answer /hello within 60s"; exit 1

      - run: pnpm --filter @superadmin/database run migrate:deploy
      - run: pnpm --filter admin exec playwright install --with-deps chromium
      - run: pnpm --filter admin run build
      - name: Run specs against the local build
        env:
          E2E_WEB_SERVER_COMMAND: pnpm --filter admin run start
        run: pnpm --filter admin exec playwright test --project=chromium

  # Runs only for main, the branch the deployed origin serves, and only on a push
  # or a manual dispatch, where secrets resolve.
  # `admin-e2e-required` repeats this condition as DEPLOYED_EXPECTED; keep the
  # two identical.
  deployed:
    name: E2E (deployed panel)
    needs: [changes]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter admin exec playwright install --with-deps chromium
      # Every one of these is consumed by this job, so a missing one is a run
      # that silently proves less than it appears to.
      - name: Fail early if the deployed leg is unprovisioned
        env:
          ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
          SA_EDGE_GATE_CREDENTIALS: ${{ secrets.SA_EDGE_GATE_CREDENTIALS }}
          SA_E2E_EMAIL: ${{ secrets.SA_E2E_EMAIL }}
          SA_E2E_PASSWORD: ${{ secrets.SA_E2E_PASSWORD }}
          SA_E2E_TOTP_SECRET: ${{ secrets.SA_E2E_TOTP_SECRET }}
        run: |
          missing=""
          [ -n "$ADMIN_ORIGIN" ]             || missing="$missing ADMIN_ORIGIN"
          [ -n "$SA_EDGE_GATE_CREDENTIALS" ] || missing="$missing SA_EDGE_GATE_CREDENTIALS"
          [ -n "$SA_E2E_EMAIL" ]             || missing="$missing SA_E2E_EMAIL"
          [ -n "$SA_E2E_PASSWORD" ]          || missing="$missing SA_E2E_PASSWORD"
          [ -n "$SA_E2E_TOTP_SECRET" ]       || missing="$missing SA_E2E_TOTP_SECRET"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Specs that need a missing one SKIP, and a skipped auth spec is"
            echo "indistinguishable from a passing one in the summary."
            exit 1
          fi
      # The origin serves whatever build finished last, which right after a push
      # is still the previous commit's. Specs run only once the panel reports
      # this commit. If a newer push replaced this build before it was served,
      # the specs are skipped here and that push's own run tests the newer
      # build. A timeout or an unreadable tip of main fails the job.
      - name: Wait for the deployed panel to serve this commit
        id: deployed_build
        shell: bash
        timeout-minutes: 15
        env:
          ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          status=0
          bash scripts/ci/wait-for-deployed-main.sh \
            "$ADMIN_ORIGIN/api/health" "$EXPECTED_SHA" || status=$?
          case "$status" in
            0) echo "served=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "Skipping the deployed specs: a newer commit replaced this build." ;;
            *) exit "$status" ;;
          esac
      - name: Run specs against the deployed panel
        if: steps.deployed_build.outputs.served == 'true'
        env:
          E2E_BASE_URL: ${{ secrets.ADMIN_ORIGIN }}
          SA_EDGE_GATE_CREDENTIALS: ${{ secrets.SA_EDGE_GATE_CREDENTIALS }}
          # An authenticated spec signs in with all three.
          SA_E2E_EMAIL: ${{ secrets.SA_E2E_EMAIL }}
          SA_E2E_PASSWORD: ${{ secrets.SA_E2E_PASSWORD }}
          SA_E2E_TOTP_SECRET: ${{ secrets.SA_E2E_TOTP_SECRET }}
          # The auth spec disables trace, screenshot and video itself; this turns
          # off the separate on-failure error-context snapshot, so a failed
          # sign-in does not write the filled fields to the runner.
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
        run: pnpm --filter admin exec playwright test --project=chromium

  # Skipped, cancelled and never-started all render as green without this.
  admin-e2e-required:
    name: Admin E2E Required
    if: always()
    needs: [changes, local, deployed]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every leg actually ran and passed
        env:
          CHANGES: ${{ needs.changes.result }}
          LOCAL: ${{ needs.local.result }}
          DEPLOYED: ${{ needs.deployed.result }}
          NEEDED: ${{ needs.changes.outputs.admin }}
          # The `deployed` job's own condition, verbatim.
          DEPLOYED_EXPECTED: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: |
          echo "changes=$CHANGES local=$LOCAL deployed=$DEPLOYED needed=$NEEDED deployed_expected=$DEPLOYED_EXPECTED"
          # Check the change-detection result before deciding nothing needs to
          # run. The output is only meaningful from a detection job that
          # succeeded, and it must say true or false outright.
          if [ "$CHANGES" != "success" ]; then
            echo "Admin E2E Required: change detection did not succeed ($CHANGES)"; exit 1
          fi
          # A skipped leg is only acceptable when the filter said the admin app
          # was untouched. Skipped for any other reason is a stage that silently
          # did not run, which is what this aggregate exists to catch.
          case "$NEEDED" in
            true) ;;
            false)
              echo "Admin E2E Required: no admin changes in this pull request, nothing to run"
              exit 0 ;;
            *)
              echo "Admin E2E Required: change detection gave no decision ('$NEEDED')"; exit 1 ;;
          esac
          if [ "$LOCAL" != "success" ]; then
            echo "Admin E2E Required: the local leg failed, was cancelled, or did not run"; exit 1
          fi
          # The deployed leg runs only for main, the branch the deployed origin
          # serves. There its absence is a failure; elsewhere it is not expected.
          if [ "$DEPLOYED_EXPECTED" = "true" ] && [ "$DEPLOYED" != "success" ]; then
            echo "Admin E2E Required: the deployed leg failed, was cancelled, or did not run"; exit 1
          fi
          echo "Admin E2E Required: passed"
