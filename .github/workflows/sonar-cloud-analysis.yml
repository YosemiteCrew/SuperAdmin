name: sonar-cloud-analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main, dev]

concurrency:
  group: sonar-${{ github.ref }}
  # Pull requests only - see ci-affected.yaml. This one also runs on a schedule,
  # and the push analysis of the merged result on `main` is what the quality gate
  # is measured from, so neither should be cancellable by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  # Placeholders so the admin env helpers don't refuse to load during test:coverage.
  # Real values are set at deploy time per environment.
  NEXT_PUBLIC_APP_ORIGIN: http://localhost:3000
  SUPERTOKENS_CONNECTION_URI: https://placeholder.supertokens.io
  SUPERTOKENS_API_KEY: placeholder-ci-key
  SUPERADMIN_BOOTSTRAP_EMAILS: admin@example.com

jobs:
  changes:
    name: Detect workspace changes
    runs-on: ubuntu-latest
    if: github.repository_owner == 'YosemiteCrew' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    outputs:
      admin: ${{ steps.filter.outputs.admin }}
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            admin:
              - 'apps/admin/**'
              - 'packages/types/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'turbo.json'
      - name: Gate
        id: gate
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          ADMIN_CHANGED: ${{ steps.filter.outputs.admin }}
        run: |
          # Dependabot runs with its OWN secret store, which does not contain
          # SONAR_TOKEN_ADMIN, so the scan can only ever fail on its PRs with
          # "Not authorized or project not found" - a red check that says nothing
          # about the change and blocks every dependency bump. Skip it there.
          # A lockfile bump still gets Lint + Type-check + Test + Build, and the
          # push analysis re-scans the merged result on dev/main.
          # To restore scanning on these PRs instead, add SONAR_TOKEN_ADMIN under
          # Settings > Secrets and variables > Dependabot and drop this branch.
          if [[ "$ACTOR" == "dependabot[bot]" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "schedule" || "$ADMIN_CHANGED" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  sonarqube:
    name: SonarQube Analysis - admin
    runs-on: ubuntu-latest
    needs: changes
    if: >
      github.repository_owner == 'YosemiteCrew' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.STORE_PATH }}
            ~/.sonar/cache
          key: cache-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: apps/admin
        run: pnpm test:coverage

      - name: Sonar Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          projectBaseDir: apps/admin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_ADMIN }}
