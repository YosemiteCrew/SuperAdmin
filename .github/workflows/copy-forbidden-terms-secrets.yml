name: Copy forbidden-terms secrets to Dependabot

# One-shot. Dependabot has its own secret scope, so the values under Actions do
# nothing for it and every Dependabot PR fails forbidden-terms.
#
# This job only ENCRYPTS. The repository token cannot reach the Dependabot
# secrets API (403), so the write happens from a session that can. Printing the
# sealed box is safe by construction: only the holder of GitHub's private key
# can open it, and it is the same blob the REST API expects over the wire.
#
# The key below is THIS repository's Dependabot public key. It is not
# interchangeable with another repository's - both report the same key_id while
# the key material differs, and encrypting with the wrong one fails as
# "improperly encrypted secret" rather than as a mismatch.
on:
  push:
    branches: [ops/run-copy-forbidden-terms]

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run without the source values
        env:
          PATTERN: ${{ secrets.FORBIDDEN_TERMS_PATTERN_B64 }}
          CORPUS: ${{ secrets.FORBIDDEN_TERMS_CORPUS_B64 }}
        run: |
          [ -n "$PATTERN" ] && [ -n "$CORPUS" ] || { echo "source secrets not set under Actions here"; exit 1; }
          echo "pattern length: ${#PATTERN}"
          echo "corpus length:  ${#CORPUS}"
      - name: Encrypt for this repository's Dependabot scope
        env:
          PUBKEY: 'yf1C8YAfuVVcvWM6VMYxPIgIbEzpuc0+oM9FTmJ+XVg='
          PATTERN: ${{ secrets.FORBIDDEN_TERMS_PATTERN_B64 }}
          CORPUS: ${{ secrets.FORBIDDEN_TERMS_CORPUS_B64 }}
        run: |
          set -euo pipefail
          npm install --no-save --silent libsodium-wrappers >/dev/null 2>&1
          node -e '
            const sodium = require("libsodium-wrappers");
            (async () => {
              await sodium.ready;
              const key = sodium.from_base64(process.env.PUBKEY, sodium.base64_variants.ORIGINAL);
              for (const name of ["PATTERN", "CORPUS"]) {
                const sealed = sodium.crypto_box_seal(sodium.from_string(process.env[name]), key);
                console.log(name + "_SEALED=" + sodium.to_base64(sealed, sodium.base64_variants.ORIGINAL));
              }
            })();
          '
