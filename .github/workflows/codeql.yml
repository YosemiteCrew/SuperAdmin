name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Must NOT be `Analyze (javascript-typescript)`: default setup now produces a
    # check run with exactly that name, and two check runs sharing one name is how a
    # required status check gets satisfied by the wrong one. A `skipped` conclusion
    # satisfies a required check, so this permanently-disabled job could stand in for
    # the live scanner.
    name: Analyze (advanced setup, disabled)
    runs-on: ubuntu-latest
    # Disabled on purpose, and it should stay that way while default setup owns
    # code scanning. This repo has CodeQL *default setup* configured, which runs
    # its own analysis and uploads it under the `dynamic/github-code-scanning`
    # analysis key. Advanced setup - this file - cannot upload alongside it;
    # GitHub rejects the SARIF while default setup is enabled. It is NOT disabled
    # for want of Advanced Security, which an earlier comment here claimed:
    # code scanning is free on public repositories.
    #
    # Change the languages default setup analyses in the repository settings, not
    # here. Re-enable this file only after turning default setup off.
    if: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
